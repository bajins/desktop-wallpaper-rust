[package]
name = "desktop-wallpaper-rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"
#[[bin]]
#name = "desktop-wallpaper-rust"
#path = "src/main.rs"
#windows_subsystem = "windows" # 为了让程序直接运行而不打开控制台窗口

# See https://doc.rust-lang.org/cargo/reference/manifest.html#the-profile-sections
[profile.release]
debug = false
strip = true
lto = "fat" # 完整 LTO（true 仅为 ThinLTO），最大化跨 crate 优化以减体积，编译更慢
opt-level = "z"
codegen-units = 1
panic = "abort"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# https://github.com/seanmonstar/reqwest
# 默认 features 保持启用（charset/http2/system-proxy），0.13 默认 TLS 即 rustls，无需显式指定
reqwest = "0.13.3"
# https://github.com/serde-rs/serde
serde = { version = "1.0.228" }
# https://github.com/serde-rs/json
serde_json = "1.0.150"
# https://github.com/tokio-rs/tokio
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "time"] }
# https://github.com/servo/rust-url
url = "2.5.8"
# command! 宏依赖 cargo feature（读取 CARGO_PKG_* 填充命令元数据），derive 未用故移除
clap = { version = "4.6.1", features = ["cargo"] }
rand = { version = "0.10.1", features = [] }
#select = "0.6.0"
scraper = "0.27.0"
#rustls = "0.23.4"

[target.'cfg(target_os = "windows")'.dependencies]
# https://github.com/microsoft/windows-rs
[dependencies.windows]
version = "0.62.2"
default-features = false
features = ["Data_Xml_Dom", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "System_UserProfile", "Win32_System_SystemServices", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement", "Win32_Networking", "Win32_Networking_NetworkListManager", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_NetworkManagement_WNet", "Win32_Networking_WinInet", "Win32_NetworkManagement_IpHelper", "Win32_System_EventNotificationService", "Win32_UI_Shell", "Win32_System_WinRT", "Storage", "Storage_Streams", "Win32_Storage", "Win32_Graphics", "Win32_Storage_FileSystem", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Opc", "Win32_System_Registry", "Win32_UI_Controls", "UI", "UI_ViewManagement", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"]

[build-dependencies]
winresource = "0.1.31"
image = "0.25.10"
ico = "0.5.0"

#[package.metadata.winres]
#OriginalFilename = "desktop-wallpaper-rust.exe"
#ProductName = "Astronomy Picture of the Day"
#ProductVersion = "0.1.0"

[dev-dependencies]
tokio-test = "0.4.5"
#actix-rt = "*"